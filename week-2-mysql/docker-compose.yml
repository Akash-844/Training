services:
  mysql:
    image: mysql:8.0
    container_name: week2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: training_root_123
      MYSQL_DATABASE: task_management
      MYSQL_USER:root
      MYSQL_PASSWORD:root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
